name: Update DSE News Data

on:
  schedule:
    # 8:05 PM Bangladesh time (UTC+6) = 14:05 UTC, every day.
    # DSE market runs ~10am-2:30pm Dhaka and posts notices through the day;
    # a morning run fires before anything is published and stays a day behind.
    - cron: '5 14 * * *'
  workflow_dispatch:
    inputs:
      full_sync:
        description: "Full sync (re-scan DSE's entire 2-year archive)?"
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      # A routine misclassification hides an announcement from the default
      # feed and produces no signal at all, so it has to be caught here.
      - name: Check classification guards
        run: python scripts/test_classify.py

      - name: Run scraper
        id: scraper
        run: |
          if [ "${{ github.event.inputs.full_sync }}" = "true" ]; then
            python scripts/scrape_dse.py --full
          else
            python scripts/scrape_dse.py
          fi
        # If the scraper exits with code 1 (0 items from DSE), this step fails.
        # GitHub will email the repo owner automatically on workflow failure.

      # Catches the quiet failure the scraper cannot see: DSE responds and
      # parsing succeeds, but nothing new has landed for days.
      - name: Verify the archive is still advancing
        run: python scripts/check_freshness.py

      # Written on every successful run, even when DSE published nothing new.
      # Two purposes: the site can show when it last checked, and the resulting
      # daily commit counts as repository activity. GitHub disables scheduled
      # workflows after 60 days without activity, so a run of quiet days must
      # never leave the repository silent.
      - name: Record last successful check
        run: |
          printf '{"lastChecked":"%s"}\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            > public/lastChecked.json

      - name: Commit and push
        run: |
          git config user.name "DSE News Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/newsData.json public/newsRoutine.json public/lastChecked.json
          if git diff --staged --quiet; then
            echo "Nothing changed — nothing to commit"
          else
            git commit -m "chore: update DSE news data $(date -u '+%Y-%m-%d')"
            git pull --rebase --autostash origin main
            git push
          fi
